[project]
name = "fema-oversight-server"
version = "0.1.0"
description = "Read-only FEMA evidence and oversight MCP server for public-data review"
readme = "README.md"
requires-python = ">=3.11"  # runs on 3.11-3.13; Databricks uses 3.12.3
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "databricks-sdk>=0.38.0,<1",
]

[project.scripts]
# Lets you run the server with `uv run fema-oversight-server`.
fema-oversight-server = "fema_oversight.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fema_oversight"]

[dependency-groups]
# Dev + eval-only deps. Install with `uv sync --group dev`.
# The Phoenix evaluation harness (see eval/) is not scaffolded in this template
# on purpose — add these when you build it per the mcp-eval skill.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", ".agents"]
# Don't reformat Python code fences inside Markdown docs (they're illustrative
# snippets, not runnable modules).
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"eval/databricks/HACKATHON_VALIDATION.py" = ["E402", "F704", "F821"]
